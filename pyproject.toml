[project]
name = "chopin"
version = "0.1.0"
description = "Compare Last.fm scrobbles against a Spotify playlist and fill the gaps"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Damian Giebas", email = "damian.giebas@solidstudio.io" },
]
dependencies = [
    "typer>=0.12",
    "pylast>=5.3",
    "spotipy>=2.24",
    "python-dotenv>=1.0",
    "questionary>=2.0",
    "platformdirs>=4.2",
]

[project.scripts]
chopin = "chopin.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chopin"]
